[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manifest-governor"
version = "0.7.0"
description = "A governed autonomous logistics-agent prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "strands-agents==1.56.0",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]
openrouter = [
  "strands-agents[openai]==1.56.0",
]
bedrock_mantle = [
  "strands-agents[openai]==1.56.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "fixtures*"]

[tool.setuptools.package-data]
"apps.dashboard" = ["static/**/*"]

fixtures = ["**/*.json", "README.md"]
